<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuchen Wang — Full Stack Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #eef2f5;
      --bg2:     #dde6eb;
      --text:    #1c2530;
      --muted:   #5a7280;
      --accent:  #2e7d8f;
      --accent2: #6fa8b8;
      --card-bg: #f5f8fa;
      --radius:  16px;
      --font-d:  'Playfair Display', Georgia, serif;
      --font-b:  'DM Sans', sans-serif;
    }
    [data-variant="B"] {
      --bg:      #f0f4f7;
      --bg2:     #deeaef;
      --text:    #18242e;
      --muted:   #516475;
      --card-bg: #f8fbfd;
      --radius:  4px;
      --font-d:  'Syne', sans-serif;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-b); line-height: 1.6;
      overflow-x: hidden; cursor: none;
      transition: background .4s, color .4s;
    }

    /* ── Cursor ───────────────────────────────── */
    #cur      { width:12px; height:12px; background:var(--accent); border-radius:50%; position:fixed; top:0; left:0; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); transition:width .18s,height .18s,background .3s; }
    #cur-ring { width:38px; height:38px; border:1.5px solid var(--accent); border-radius:50%; position:fixed; top:0; left:0; pointer-events:none; z-index:9998; transform:translate(-50%,-50%); opacity:.45; transition:opacity .2s,border-color .3s; }

    /* ── Nav ──────────────────────────────────── */
    nav { position:fixed; top:0; left:0; right:0; height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 56px; z-index:200; transition:background .35s,border-color .35s; border-bottom:1px solid transparent; }
    nav.scrolled { background:rgba(238,242,245,.88); backdrop-filter:blur(16px); border-color:rgba(0,0,0,.06); }
    [data-variant="B"] nav.scrolled { background:rgba(240,244,247,.88); }

    /* On-hero: dark background → white text */
    nav.on-hero.scrolled { background:rgba(18,32,46,.55); backdrop-filter:blur(20px); border-color:rgba(255,255,255,.08); }
    .nav-name  { font-family:var(--font-d); font-weight:700; font-size:17px; letter-spacing:-.02em; color:var(--text); transition:color .35s; }
    .nav-links { display:flex; gap:36px; list-style:none; }
    .nav-links a { color:var(--muted); text-decoration:none; font-size:14px; letter-spacing:.03em; transition:color .35s; }
    .nav-links a:hover { color:var(--accent); }

    /* Hero state overrides */
    nav.on-hero .nav-name  { color:rgba(255,255,255,.95); }
    nav.on-hero .nav-links a { color:rgba(255,255,255,.65); }
    nav.on-hero .nav-links a:hover { color:#fff; }

    /* ── Hero ─────────────────────────────────── */
    #hero { position:relative; min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; text-align:left; padding:100px clamp(48px,8vw,120px) 80px; overflow:hidden; }

    /* Hero background image layers */
    .hero-bg-img {
      position:absolute; inset:0; z-index:0;
      background:url('uploads/bg_image.jpg') center/cover no-repeat;
      transform:scale(1.03);
      animation:heroZoom 18s ease-in-out infinite alternate;
    }
    @keyframes heroZoom { from{transform:scale(1.03)} to{transform:scale(1.08)} }
    .hero-bg-overlay {
      position:absolute; inset:0; z-index:1;
      background: linear-gradient(to right,
        rgba(18,32,46,.55) 0%,
        rgba(18,32,46,.40) 42%,
        rgba(18,32,46,.18) 100%
      );
    }
    [data-variant="B"] .hero-bg-overlay {
      background: linear-gradient(to right,
        rgba(18,32,46,.58) 0%,
        rgba(18,32,46,.42) 42%,
        rgba(18,32,46,.18) 100%
      );
    }
    #pcanvas { position:absolute; inset:0; z-index:2; opacity:.35; }
    [data-variant="B"] #hero::after { content:''; position:absolute; inset:0; background-image:radial-gradient(circle,rgba(46,125,143,.06) 1px,transparent 1px); background-size:30px 30px; z-index:3; }
    .blob { display:none !important; }
    .hero-inner { position:relative; z-index:1; }

    .hero-eyebrow { font-size:12px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:28px; opacity:0; transform:translateY(16px); animation:fup .6s .15s forwards; }
    .hero-h1  { font-family:var(--font-d); font-size:86px; font-weight:900; line-height:1.0; letter-spacing:-.035em; margin-bottom:36px; }
    .hw { display:inline-block; opacity:0; transform:translateY(48px); animation:fup .75s forwards; }
    .hw em { font-style:italic; color:var(--accent); }
    .hero-sub  { font-size:clamp(15px,1.8vw,19px); color:var(--muted); font-weight:300; max-width:480px; margin:0 0 40px; opacity:0; transform:translateY(16px); animation:fup .6s .9s forwards; text-wrap:pretty; }
    .hero-tags { display:flex; gap:10px; justify-content:flex-start; flex-wrap:wrap; opacity:0; transform:translateY(16px); animation:fup .6s 1.05s forwards; }
    .htag { background:var(--bg2); border:1px solid rgba(0,0,0,.07); padding:6px 18px; border-radius:100px; font-size:13px; font-weight:500; color:var(--muted); transition:all .2s; white-space:nowrap; }
    .htag:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
    .scroll-hint { position:absolute; bottom:44px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; opacity:0; animation:fup .6s 1.5s forwards; }
    .scroll-hint span { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    .scroll-line { width:1px; height:52px; background:linear-gradient(to bottom,var(--accent),transparent); animation:spulse 1.8s ease-in-out infinite; }

    /* ── Hero dark-bg text overrides ─────────── */
    #hero .hero-eyebrow { color:var(--accent2); }
    #hero .hero-h1, #hero .hw { color:#ffffff; }
    #hero .hw em { color:var(--accent2); font-style:italic; }
    #hero .hero-sub { color:rgba(255,255,255,.72); margin:0 0 40px; }
    [data-variant="B"] #hero .hero-sub { margin-left:0; }
    #hero .htag { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.18); color:rgba(255,255,255,.88); backdrop-filter:blur(6px); }
    #hero .htag:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
    #hero .scroll-hint span { color:rgba(255,255,255,.5); }
    #hero .scroll-line { background:linear-gradient(to bottom,var(--accent2),transparent); }

    /* ── Section Shell ────────────────────────── */
    .sec { padding:128px 56px; max-width:1240px; margin:0 auto; }
    .sec-head { display:flex; align-items:baseline; gap:20px; margin-bottom:72px; }
    .sec-label { font-size:11px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); white-space:nowrap; }
    .sec-title { font-family:var(--font-d); font-size:clamp(32px,5vw,60px); font-weight:900; letter-spacing:-.03em; line-height:1; }
    .sec-title em { font-style:italic; color:var(--accent); }
    .sec-rule { flex:1; height:1px; background:rgba(0,0,0,.09); }

    /* ── Work ─────────────────────────────────── */
    .work-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }
    .wcard { background:var(--card-bg); border-radius:var(--radius); overflow:hidden; border:1px solid rgba(0,0,0,.06); cursor:none; transform-style:preserve-3d; transition:box-shadow .3s; will-change:transform; }
    .wcard:hover { box-shadow:0 28px 60px rgba(0,0,0,.11); }
    .wcard.wide { grid-column:1/-1; }
    .wcard-img { position:relative; width:100%; background:var(--bg2); overflow:hidden; }
    .wcard.wide .wcard-img { aspect-ratio:21/9; }
    .wcard:not(.wide) .wcard-img { aspect-ratio:16/9; }
    .wcard-canvas { width:100%; height:100%; display:block; }
    .wcard-over { position:absolute; inset:0; background:var(--accent); opacity:0; transition:opacity .3s; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:500; letter-spacing:.06em; }
    .wcard:hover .wcard-over { opacity:.88; }
    .wcard-body { padding:26px 28px 20px; }
    .wcard-tags { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px; }
    .wcard-tag  { font-size:11px; font-weight:500; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); background:rgba(46,125,143,.09); padding:3px 10px; border-radius:100px; }
    .wcard-title { font-family:var(--font-d); font-size:clamp(20px,2.2vw,26px); font-weight:700; letter-spacing:-.02em; line-height:1.2; margin-bottom:10px; }
    .wcard-desc  { font-size:14px; color:var(--muted); line-height:1.65; }
    .wcard-foot  { padding:14px 28px; border-top:1px solid rgba(0,0,0,.05); display:flex; align-items:center; justify-content:space-between; }
    .wcard-year  { font-size:12px; color:var(--muted); }
    .wcard-link  { font-size:13px; font-weight:500; color:var(--accent); text-decoration:none; display:flex; align-items:center; gap:5px; transition:gap .2s; }
    .wcard-link:hover { gap:10px; }

    /* ── Skills ───────────────────────────────── */
    #skills { background:var(--bg); overflow:hidden; }
    .marquee-wrap { position:relative; margin-bottom:56px; }
    .marquee-wrap::before,.marquee-wrap::after { content:''; position:absolute; top:0; bottom:0; width:120px; z-index:2; pointer-events:none; }
    .marquee-wrap::before { left:0;  background:linear-gradient(to right,var(--bg),transparent); }
    .marquee-wrap::after  { right:0; background:linear-gradient(to left, var(--bg),transparent); }
    .marquee-row { display:flex; gap:12px; width:max-content; margin-bottom:12px; }
    .marquee-row.r1 { animation:mq1 28s linear infinite; }
    .marquee-row.r2 { animation:mq2 22s linear infinite; }
    @keyframes mq1 { from{transform:translateX(0)}    to{transform:translateX(-50%)} }
    @keyframes mq2 { from{transform:translateX(-50%)} to{transform:translateX(0)}    }
    .mq-tag { background:var(--card-bg); border:1px solid rgba(0,0,0,.07); padding:9px 22px; border-radius:100px; font-size:14px; font-weight:500; color:var(--text); white-space:nowrap; transition:all .2s; flex-shrink:0; }
    .mq-tag:hover { background:var(--accent); color:#fff; border-color:var(--accent); cursor:none; }
    .mq-tag.accent { background:var(--accent); color:#fff; border-color:var(--accent); }
    .sk-cats  { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; }
    .sk-cat   { padding:40px 36px; border:1px solid rgba(0,0,0,.07); position:relative; overflow:hidden; transition:background .25s; }
    .sk-cat:hover { background:var(--bg2); }
    .sk-cat-num   { font-family:var(--font-d); font-size:72px; font-weight:900; color:var(--accent); opacity:.08; position:absolute; top:16px; right:24px; line-height:1; letter-spacing:-.04em; pointer-events:none; }
    .sk-cat-title { font-family:var(--font-d); font-size:20px; font-weight:700; letter-spacing:-.02em; margin-bottom:24px; }
    .sk-list  { display:flex; flex-direction:column; gap:10px; }
    .sk-entry { display:flex; align-items:center; gap:10px; font-size:14px; color:var(--text); }
    .sk-dot   { width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0; opacity:.6; }
    [data-variant="A"] .sk-cats { border-radius:var(--radius); overflow:hidden; }

    /* ── About ────────────────────────────────── */
    #about { background:var(--bg2); }
    .about-inner { display:grid; grid-template-columns:1fr 1fr; gap:80px; align-items:center; }
    .about-text h2 { font-family:var(--font-d); font-size:clamp(28px,4vw,44px); font-weight:900; letter-spacing:-.03em; line-height:1.15; margin-bottom:24px; }
    .about-text h2 em { font-style:italic; color:var(--accent); }
    .about-text p  { color:var(--muted); font-size:15px; line-height:1.75; margin-bottom:16px; text-wrap:pretty; }
    .about-stats   { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    .stat-box  { background:var(--card-bg); border-radius:var(--radius); border:1px solid rgba(0,0,0,.06); padding:28px 24px; }
    .stat-num  { font-family:var(--font-d); font-size:clamp(36px,4vw,48px); font-weight:900; color:var(--accent); letter-spacing:-.03em; line-height:1; margin-bottom:6px; }
    .stat-label { font-size:13px; color:var(--muted); }

    /* ── Contact ──────────────────────────────── */
    #contact { text-align:center; padding:128px 56px; background:var(--bg); }
    .ct-inner  { max-width:720px; margin:0 auto; }
    .ct-label  { font-size:11px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:24px; }
    .ct-title  { font-family:var(--font-d); font-size:clamp(42px,6.5vw,86px); font-weight:900; letter-spacing:-.035em; line-height:1.0; margin-bottom:40px; }
    .ct-title em { font-style:italic; color:var(--accent); }
    .ct-email  { font-size:clamp(17px,2.2vw,22px); font-weight:300; color:var(--muted); text-decoration:none; border-bottom:1px solid rgba(0,0,0,.15); padding-bottom:3px; display:inline-block; margin-bottom:52px; transition:color .2s,border-color .2s; }
    .ct-email:hover { color:var(--accent); border-color:var(--accent); }
    .ct-socials { display:flex; gap:12px; justify-content:center; }
    .ct-soc { display:inline-flex; align-items:center; gap:8px; padding:11px 24px; border:1.5px solid rgba(0,0,0,.1); border-radius:100px; font-size:14px; font-weight:500; color:var(--text); text-decoration:none; transition:all .22s; }
    .ct-soc:hover { background:var(--accent); color:#fff; border-color:var(--accent); }

    /* ── Footer ───────────────────────────────── */
    footer { text-align:center; padding:28px; font-size:12px; color:var(--muted); border-top:1px solid rgba(0,0,0,.06); }

    /* ── Animations ───────────────────────────── */
    @keyframes fup    { to { opacity:1; transform:translateY(0); } }
    @keyframes spulse { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* ── Scroll Reveal ────────────────────────── */
    .rev    { opacity:0; transform:translateY(36px); transition:opacity .7s,transform .7s; }
    .rev.on { opacity:1; transform:none; }

    /* ── Tweaks Panel ─────────────────────────── */
    #tp      { display:none; position:fixed; bottom:24px; right:24px; background:#fff; border:1px solid rgba(0,0,0,.1); border-radius:20px; padding:24px 22px; z-index:1000; min-width:250px; box-shadow:0 12px 48px rgba(0,0,0,.12); font-family:'DM Sans',sans-serif; }
    #tp.show { display:block; }
    .tp-head { font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:#71717a; margin-bottom:20px; }
    .tp-row  { margin-bottom:18px; }
    .tp-label { font-size:13px; font-weight:500; margin-bottom:10px; display:block; color:#18181b; }
    .tp-opts { display:flex; gap:8px; }
    .tp-btn  { flex:1; padding:8px 6px; border:1.5px solid rgba(0,0,0,.1); border-radius:8px; background:#fff; font-size:12px; font-weight:500; cursor:pointer; transition:all .18s; color:#18181b; }
    .tp-btn.on { background:var(--accent); color:#fff; border-color:var(--accent); }
    .tp-colors { display:flex; gap:8px; }
    .tp-c  { width:26px; height:26px; border-radius:50%; border:2.5px solid transparent; cursor:pointer; transition:transform .18s,border-color .18s; }
    .tp-c:hover { transform:scale(1.15); }
    .tp-c.on { border-color:#1a1510; }

    @media (max-width: 768px) {
      nav { padding:0 24px; }
      .sec { padding:80px 24px; }
      .work-grid { grid-template-columns:1fr; }
      .wcard.wide { grid-column:auto; }
      .sk-cats { grid-template-columns:1fr; }
      .about-inner { grid-template-columns:1fr; gap:40px; }
      #hero { padding:80px clamp(24px,6vw,80px) 60px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/hooks.jsx"></script>
  <script type="text/babel" src="components/Cursor.jsx"></script>
  <script type="text/babel" src="components/Nav.jsx"></script>
  <script type="text/babel" src="components/Hero.jsx"></script>
  <script type="text/babel" src="components/Work.jsx"></script>
  <script type="text/babel" src="components/Skills.jsx"></script>
  <script type="text/babel" src="components/About.jsx"></script>
  <script type="text/babel" src="components/Contact.jsx"></script>
  <script type="text/babel" src="components/Tweaks.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
